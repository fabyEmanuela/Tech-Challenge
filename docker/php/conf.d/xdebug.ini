; Ativa a depuração e os recursos de desenvolvimento
xdebug.mode=debug,develop

; Inicia a depuração em todas as requisições
xdebug.start_with_request=yes

; Endereço do computador host acessível pelo container
xdebug.client_host=host.docker.internal

; Porta utilizada pelo VS Code para depuração
xdebug.client_port=9003

; Arquivo que registrará as tentativas de conexão
xdebug.log=/tmp/xdebug.log

; Registra informações detalhadas para diagnóstico
xdebug.log_level=7
