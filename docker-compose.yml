services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech-challenge-php
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      XDEBUG_MODE: debug,develop

  db:
    image: mysql:8.4
    container_name: tech-challenge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  swagger:
    image: swaggerapi/swagger-ui
    container_name: tech-challenge-swagger
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /docs/swagger.json
    volumes:
      - ./docs:/docs

volumes:
  mysql_data:

