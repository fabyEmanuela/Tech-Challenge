# -----------------------------------------------------------------------
# SonarQube / SonarCloud Configuration
# Tech Challenge - Sistema de Gestão de Oficina Mecânica (SOAT - Fase 1)
# -----------------------------------------------------------------------

# Identificação do Projeto
sonar.projectKey=Tech-Challenge
sonar.projectName=Tech Challenge - Oficina Mecanica
sonar.projectVersion=1.0.0

# Código-fonte analisado
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.php.version=8.3

# Diretórios e arquivos excluídos do scan de regras de produção
sonar.exclusions=src/tests/**,vendor/**,public/**,docs/**

# Testes automatizados
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*Test.php

# Qualidade e Segurança (SAST)
sonar.php.coverage.reportPaths=coverage.xml

